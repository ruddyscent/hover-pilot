[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hover-pilot"
version = "2.1.0"
description = "RealFlight Link client and Gymnasium hover environment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kyungwon Chun" },
]
keywords = ["realflight", "gymnasium", "reinforcement-learning", "ppo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium",
    "numpy",
    "pydantic",
    "python-dotenv>=1.2.2",
    "tomli>=2.2.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ruddyscent/hover-pilot"
Repository = "https://github.com/ruddyscent/hover-pilot"
Issues = "https://github.com/ruddyscent/hover-pilot/issues"
Documentation = "https://github.com/ruddyscent/hover-pilot/blob/main/docs/user-guide.md"

[project.optional-dependencies]
rl = [
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
]

[project.scripts]
hoverpilot-demo = "hoverpilot.main:main"
hoverpilot-doctor = "hoverpilot.doctor:main"
hoverpilot-validate = "hoverpilot.validate_env:main"
hoverpilot-ppo = "hoverpilot.rl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hoverpilot.configs" = ["*.toml"]
