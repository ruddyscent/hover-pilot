[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hover-pilot"
version = "0.1.0"
description = "RealFlight Link client and Gymnasium hover environment"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kyungwon Chun" },
]
keywords = ["realflight", "gymnasium", "reinforcement-learning", "ppo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium",
    "numpy",
    "pydantic",
    "python-dotenv"
]

[project.urls]
Homepage = "https://github.com/ruddyscent/hover-pilot"
Repository = "https://github.com/ruddyscent/hover-pilot"
Issues = "https://github.com/ruddyscent/hover-pilot/issues"
Documentation = "https://github.com/ruddyscent/hover-pilot/blob/main/docs/user-guide.md"

[project.optional-dependencies]
rl = [
    "tensorboard>=2.10,<2.16; python_version < '3.9'",
    "tensorboard>=2.16.0; python_version >= '3.9'",
    "torch>=1.12; python_version < '3.10'",
    "torch>=2.0.0; python_version >= '3.10'",
]

[project.scripts]
hoverpilot-demo = "hoverpilot.main:main"
hoverpilot-validate = "hoverpilot.validate_env:main"
hoverpilot-ppo = "hoverpilot.rl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
